services:
  kitchen-postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${KITCHEN_POSTGRES_DB:-kitchen}
      POSTGRES_USER: ${KITCHEN_POSTGRES_USER:-kitchen}
      POSTGRES_PASSWORD: ${KITCHEN_POSTGRES_PASSWORD:-kitchen}
    ports:
      - "127.0.0.1:${KITCHEN_POSTGRES_PORT:-15432}:5432"
    volumes:
      - kitchen-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15

  restaurant-postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${RESTAURANT_POSTGRES_DB:-restaurant}
      POSTGRES_USER: ${RESTAURANT_POSTGRES_USER:-restaurant}
      POSTGRES_PASSWORD: ${RESTAURANT_POSTGRES_PASSWORD:-restaurant}
    ports:
      - "127.0.0.1:${RESTAURANT_POSTGRES_PORT:-15433}:5432"
    volumes:
      - restaurant-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15

  kitchen-migrate:
    build:
      context: .
      dockerfile: deploy/docker/kitchen-api.Dockerfile
      target: migrate
    command:
      - -dir
      - /migrations/kitchen
      - postgres
      - postgres://${KITCHEN_POSTGRES_USER:-kitchen}:${KITCHEN_POSTGRES_PASSWORD:-kitchen}@kitchen-postgres:5432/${KITCHEN_POSTGRES_DB:-kitchen}?sslmode=disable
      - up
    depends_on:
      kitchen-postgres:
        condition: service_healthy

  restaurant-migrate:
    build:
      context: .
      dockerfile: deploy/docker/kitchen-api.Dockerfile
      target: migrate
    command:
      - -dir
      - /migrations/restaurant
      - postgres
      - postgres://${RESTAURANT_POSTGRES_USER:-restaurant}:${RESTAURANT_POSTGRES_PASSWORD:-restaurant}@restaurant-postgres:5432/${RESTAURANT_POSTGRES_DB:-restaurant}?sslmode=disable
      - up
    depends_on:
      restaurant-postgres:
        condition: service_healthy

  kitchen-api:
    build:
      context: .
      dockerfile: deploy/docker/kitchen-api.Dockerfile
      target: kitchen-api
    environment:
      DATABASE_URL: postgres://${KITCHEN_POSTGRES_USER:-kitchen}:${KITCHEN_POSTGRES_PASSWORD:-kitchen}@kitchen-postgres:5432/${KITCHEN_POSTGRES_DB:-kitchen}?sslmode=disable
      KITCHEN_HTTP_ADDR: :8080
      KITCHEN_GRPC_ADDR: :9090
      RESTAURANT_GRPC_ROUTES: ${RESTAURANT_GRPC_ROUTES:-00000000-0000-0000-0000-000000000001=restaurant-demo:9091}
    ports:
      - "127.0.0.1:${KITCHEN_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${KITCHEN_GRPC_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      kitchen-postgres:
        condition: service_healthy
      kitchen-migrate:
        condition: service_completed_successfully
      restaurant-demo:
        condition: service_healthy

  restaurant-demo:
    build:
      context: .
      dockerfile: deploy/docker/restaurant-demo.Dockerfile
    environment:
      DATABASE_URL: postgres://${RESTAURANT_POSTGRES_USER:-restaurant}:${RESTAURANT_POSTGRES_PASSWORD:-restaurant}@restaurant-postgres:5432/${RESTAURANT_POSTGRES_DB:-restaurant}?sslmode=disable
      RESTAURANT_GRPC_ADDR: :9091
      KITCHEN_GRPC_TARGET: kitchen-api:9090
      RESTAURANT_ID: ${RESTAURANT_ID:-00000000-0000-0000-0000-000000000001}
    ports:
      - "127.0.0.1:${RESTAURANT_GRPC_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9091"]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      restaurant-postgres:
        condition: service_healthy
      restaurant-migrate:
        condition: service_completed_successfully

volumes:
  kitchen-postgres-data:
  restaurant-postgres-data:
