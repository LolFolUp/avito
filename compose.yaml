services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitchen}
      POSTGRES_USER: ${POSTGRES_USER:-kitchen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitchen}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/kitchen-api.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kitchen}:${POSTGRES_PASSWORD:-kitchen}@postgres:5432/${POSTGRES_DB:-kitchen}?sslmode=disable
    command:
      - -dir
      - /migrations
      - postgres
      - postgres://${POSTGRES_USER:-kitchen}:${POSTGRES_PASSWORD:-kitchen}@postgres:5432/${POSTGRES_DB:-kitchen}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  kitchen-api:
    build:
      context: .
      dockerfile: deploy/docker/kitchen-api.Dockerfile
      target: kitchen-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kitchen}:${POSTGRES_PASSWORD:-kitchen}@postgres:5432/${POSTGRES_DB:-kitchen}?sslmode=disable
      KITCHEN_HTTP_ADDR: :8080
      KITCHEN_GRPC_ADDR: :9090
      KITCHEN_LOG_LEVEL: ${KITCHEN_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${KITCHEN_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${KITCHEN_GRPC_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  restaurant-demo:
    build:
      context: .
      dockerfile: deploy/docker/restaurant-demo.Dockerfile
    environment:
      KITCHEN_GRPC_ADDR: kitchen-api:9090
      RESTAURANT_ID: ${RESTAURANT_ID:-00000000-0000-0000-0000-000000000001}
      RESTAURANT_POLL_INTERVAL: ${RESTAURANT_POLL_INTERVAL:-2s}
    depends_on:
      kitchen-api:
        condition: service_healthy

volumes:
  postgres-data:
