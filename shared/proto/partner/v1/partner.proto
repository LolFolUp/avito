syntax = "proto3";

package partner.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/talense-tasks/backend-trainee-assignment-autumn-2026-flow-2-lolfolup-0eb52e46/shared/pkg/proto/partner/v1;partnerv1";

// RestaurantService — приватный API restaurant-demo для Kitchen.
// Restaurant-demo владеет меню и принимает окончательное решение о возможности заказа.
service RestaurantService {
  // GetMenu возвращает актуальное меню непосредственно из хранилища ресторана.
  // Метод не резервирует позиции и не гарантирует, что они останутся доступны позже.
  rpc GetMenu(GetMenuRequest) returns (GetMenuResponse);

  // CreateRestaurantOrder атомарно проверяет позиции и создаёт заказ в ресторане.
  // При успехе все позиции считаются принятыми рестораном, при ошибке заказ не создаётся.
  rpc CreateRestaurantOrder(CreateRestaurantOrderRequest) returns (CreateRestaurantOrderResponse);
}

// RestaurantOrderStatus описывает состояние заказа внутри restaurant-demo.
enum RestaurantOrderStatus {
  // RESTAURANT_ORDER_STATUS_UNSPECIFIED означает, что статус не задан.
  RESTAURANT_ORDER_STATUS_UNSPECIFIED = 0;

  // RESTAURANT_ORDER_STATUS_ACCEPTED — ресторан проверил позиции и принял заказ.
  RESTAURANT_ORDER_STATUS_ACCEPTED = 1;

  // RESTAURANT_ORDER_STATUS_PREPARING — ресторан готовит заказ.
  RESTAURANT_ORDER_STATUS_PREPARING = 2;

  // RESTAURANT_ORDER_STATUS_READY — заказ готов.
  RESTAURANT_ORDER_STATUS_READY = 3;

  // RESTAURANT_ORDER_STATUS_DELIVERING — заказ передан в доставку.
  RESTAURANT_ORDER_STATUS_DELIVERING = 4;

  // RESTAURANT_ORDER_STATUS_DELIVERED — заказ доставлен; это терминальный статус.
  RESTAURANT_ORDER_STATUS_DELIVERED = 5;
}

// MenuItem описывает позицию, которой владеет restaurant-demo.
message MenuItem {
  // UUID позиции в базе restaurant-demo. Kitchen использует его без дополнительного external_id.
  string id = 1;

  // Название блюда.
  string name = 2;

  // Описание блюда.
  string description = 3;

  // Цена в минимальных единицах валюты: 590 рублей передаются как 59000 копеек.
  int64 price_minor = 4;

  // Трёхбуквенный код валюты, например RUB.
  string currency = 5;

  // Можно ли заказать позицию прямо сейчас.
  bool is_available = 6;

  // Версия позиции. Клиент возвращает увиденную версию при создании заказа.
  int64 version = 7;
}

// GetMenuRequest задаёт ресторан, меню которого запрашивает Kitchen.
message GetMenuRequest {
  // UUID ресторана из каталога Kitchen.
  string restaurant_id = 1;
}

// GetMenuResponse содержит актуальное меню ресторана.
message GetMenuResponse {

  // Активные позиции меню. Временно недоступные позиции тоже возвращаются.
  repeated MenuItem items = 3;
}

// CreateRestaurantOrderItem описывает выбранную клиентом позицию.
message CreateRestaurantOrderItem {
  // UUID позиции в базе restaurant-demo.
  string menu_item_id = 1;

  // Количество единиц блюда.
  int32 quantity = 2;

  // Версия, которую клиент увидел в GetMenu.
  // Несовпадение версии означает изменение меню и приводит к конфликту.
  int64 observed_version = 3;
}

// CreateRestaurantOrderRequest передаёт данные для проверки и создания заказа.
message CreateRestaurantOrderRequest {
  // UUID, заранее созданный Kitchen и общий для записей в обеих базах.
  string order_id = 1;

  // UUID ресторана из каталога Kitchen.
  string restaurant_id = 2;

  // Имя клиента.
  string customer_name = 3;

  // Телефон клиента.
  string customer_phone = 4;

  // Адрес доставки.
  string delivery_address = 5;

  // Непустой список позиций заказа.
  repeated CreateRestaurantOrderItem items = 6;
}

// CreateRestaurantOrderResponse возвращает заказ, принятый рестораном.
message CreateRestaurantOrderResponse {
  // Созданный заказ с авторитетными snapshots названий и цен.
  RestaurantOrder order = 1;
}

// RestaurantOrder описывает заказ в restaurant-demo.
message RestaurantOrder {
  // UUID заказа, полученный от Kitchen.
  string id = 1;

  // UUID ресторана, который создал заказ.
  string restaurant_id = 2;

  // Текущий статус заказа.
  RestaurantOrderStatus status = 3;

  // Имя клиента.
  string customer_name = 4;

  // Телефон клиента.
  string customer_phone = 5;

  // Адрес доставки.
  string delivery_address = 6;

  // Позиции со snapshots на момент атомарной проверки.
  repeated RestaurantOrderItem items = 7;

  // Полная стоимость заказа в минимальных единицах валюты.
  int64 total_minor = 8;

  // Трёхбуквенный код валюты, например RUB.
  string currency = 9;

  // Момент создания заказа рестораном.
  google.protobuf.Timestamp created_at = 10;

  // Момент последнего изменения заказа.
  google.protobuf.Timestamp updated_at = 11;
}

// RestaurantOrderItem содержит одну позицию и её неизменяемый snapshot.
message RestaurantOrderItem {
  // UUID позиции меню в restaurant-demo.
  string menu_item_id = 1;

  // Snapshot названия блюда.
  string name = 2;

  // Snapshot цены одной единицы.
  int64 unit_price_minor = 3;

  // Количество единиц блюда.
  int32 quantity = 4;

  // Стоимость строки: unit_price_minor * quantity.
  int64 line_total_minor = 5;
}
