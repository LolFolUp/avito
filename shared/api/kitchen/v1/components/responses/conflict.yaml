description: |
  Меню изменилось или ресторан не может принять заказ.

  Ответ сообщает только факт конфликта: разбивки по конкретным позициям
  в MVP нет. Клиент перечитывает меню и пересобирает корзину целиком.
content:
  application/problem+json:
    schema:
      $ref: ../errors/error.yaml
    example:
      type: https://avito-kitchen.local/errors/menu_changed
      title: Request cannot be completed
      status: 409
      code: MENU_CHANGED
      detail: one or more menu items have changed or are unavailable
