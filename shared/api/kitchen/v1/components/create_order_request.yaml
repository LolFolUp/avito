type: object
required:
  - restaurant_id
  - customer_name
  - customer_phone
  - delivery_address
  - items
properties:
  restaurant_id:
    type: string
    format: uuid
  customer_name:
    type: string
    minLength: 1
    maxLength: 200
  customer_phone:
    type: string
    minLength: 5
    maxLength: 32
  delivery_address:
    type: string
    minLength: 1
    maxLength: 1000
  items:
    type: array
    minItems: 1
    maxItems: 100
    items:
      $ref: ./create_order_item.yaml
