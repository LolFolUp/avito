type: object
required:
  - menu_item_id
  - quantity
  - observed_version
properties:
  menu_item_id:
    type: string
    format: uuid
    description: UUID позиции в базе restaurant-demo
  quantity:
    type: integer
    minimum: 1
    maximum: 99
  observed_version:
    type: integer
    format: int64
    minimum: 1
    description: Версия позиции, полученная клиентом при чтении live-меню
