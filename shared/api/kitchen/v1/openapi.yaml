openapi: 3.0.3
info:
  title: Avito.Kitchen Public API
  description: Публичный REST API
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: Restaurants
  - name: Orders
  - name: Health
paths:
  /api/v1/restaurants:
    get:
      tags: [Restaurants]
      operationId: listRestaurants
      summary: List active restaurants
      responses:
        "200":
          description: Active restaurants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantList"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/restaurants/{restaurantId}/menu:
    get:
      tags: [Restaurants]
      operationId: getRestaurantMenu
      summary: Get a restaurant menu
      parameters:
        - $ref: "#/components/parameters/RestaurantID"
      responses:
        "200":
          description: Restaurant menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created and waiting for restaurant confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Menu changed or the restaurant cannot accept the order
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Order state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /healthz:
    get:
      tags: [Health]
      operationId: health
      summary: Check process liveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      tags: [Health]
      operationId: readiness
      summary: Check service readiness
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A required dependency is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  parameters:
    RestaurantID:
      name: restaurantId
      in: path
      required: true
      description: Restaurant identifier
      schema:
        type: string
        format: uuid
    OrderID:
      name: orderId
      in: path
      required: true
      description: Order identifier
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Restaurant:
      type: object
      required:
        - id
        - name
        - accepting_orders
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        accepting_orders:
          type: boolean

    RestaurantList:
      type: object
      required: [restaurants]
      properties:
        restaurants:
          type: array
          items:
            $ref: "#/components/schemas/Restaurant"

    Menu:
      type: object
      required:
        - restaurant_id
        - accepting_orders
        - items
      properties:
        restaurant_id:
          type: string
          format: uuid
        accepting_orders:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"

    MenuItem:
      type: object
      required:
        - id
        - name
        - price_minor
        - currency
        - is_available
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        price_minor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: RUB
        is_available:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1

    CreateOrderRequest:
      type: object
      required:
        - restaurant_id
        - customer_name
        - customer_phone
        - delivery_address
        - items
      properties:
        restaurant_id:
          type: string
          format: uuid
        customer_name:
          type: string
          minLength: 1
          maxLength: 200
        customer_phone:
          type: string
          minLength: 5
          maxLength: 32
        delivery_address:
          type: string
          minLength: 1
          maxLength: 1000
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CreateOrderItem"

    CreateOrderItem:
      type: object
      required:
        - menu_item_id
        - quantity
        - observed_version
      properties:
        menu_item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        observed_version:
          type: integer
          format: int64
          minimum: 1

    Order:
      type: object
      required:
        - id
        - restaurant_id
        - status
        - customer_name
        - customer_phone
        - delivery_address
        - items
        - total_minor
        - currency
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"
        customer_name:
          type: string
        customer_phone:
          type: string
        delivery_address:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total_minor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        rejection_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderItem:
      type: object
      required:
        - menu_item_id
        - name
        - unit_price_minor
        - quantity
        - line_total_minor
      properties:
        menu_item_id:
          type: string
          format: uuid
        name:
          type: string
        unit_price_minor:
          type: integer
          format: int64
          minimum: 0
        quantity:
          type: integer
          minimum: 1
        line_total_minor:
          type: integer
          format: int64
          minimum: 0

    OrderStatus:
      type: string
      enum:
        - pending_confirmation
        - accepted
        - preparing
        - ready
        - delivering
        - delivered
        - rejected

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProblemItem"

    ProblemItem:
      type: object
      required: [code]
      properties:
        code:
          type: string
        field:
          type: string
        menu_item_id:
          type: string
          format: uuid
        requested_version:
          type: integer
          format: int64
        current_version:
          type: integer
          format: int64
        is_available:
          type: boolean
        current_price_minor:
          type: integer
          format: int64
          minimum: 0
