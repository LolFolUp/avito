openapi: 3.0.3
info:
  title: Avito.Kitchen Public API
  version: 1.0.0
  description: |
    Публичный REST API для web-клиента Avito.Kitchen.

    Позволяет просматривать рестораны и их меню,
    создавать заказы и получать их актуальный статус.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Restaurants
    description: Просмотр доступных ресторанов и их меню
  - name: Orders
    description: Создание заказов и получение их текущего состояния
  - name: Health
    description: Проверка работоспособности и готовности сервиса
paths:
  /api/v1/restaurants:
    $ref: ./paths/restaurants.yaml
  /api/v1/restaurants/{restaurantId}/menu:
    $ref: ./paths/restaurant_menu.yaml
  /api/v1/orders:
    $ref: ./paths/orders.yaml
  /api/v1/orders/{orderId}:
    $ref: ./paths/order_by_id.yaml
  /healthz:
    $ref: ./paths/health.yaml
  /readyz:
    $ref: ./paths/readiness.yaml
