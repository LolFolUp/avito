post:
  tags: [Orders]
  operationId: createOrder
  summary: Создать заказ
  description: |
    Kitchen синхронно просит restaurant-demo атомарно проверить позиции
    и создать ресторанный заказ. При конфликте меню заказ не создаётся.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/create_order_request.yaml
  responses:
    "201":
      description: Заказ атомарно проверен и принят рестораном
      content:
        application/json:
          schema:
            $ref: ../components/order.yaml
    "400":
      $ref: ../components/responses/bad_request.yaml
    "404":
      $ref: ../components/responses/not_found.yaml
    "409":
      $ref: ../components/responses/conflict.yaml
    "500":
      $ref: ../components/responses/internal_error.yaml
    "503":
      $ref: ../components/responses/service_unavailable.yaml
