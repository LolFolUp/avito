get:
  tags: [Restaurants]
  operationId: getRestaurantMenu
  summary: Получить актуальное меню ресторана
  description: Kitchen запрашивает меню непосредственно у restaurant-demo и не хранит его копию.
  parameters:
    - $ref: ../components/params/restaurant_id.yaml
  responses:
    "200":
      description: Live-меню из хранилища restaurant-demo
      content:
        application/json:
          schema:
            $ref: ../components/menu.yaml
    "400":
      $ref: ../components/responses/bad_request.yaml
    "404":
      $ref: ../components/responses/not_found.yaml
    "500":
      $ref: ../components/responses/internal_error.yaml
    "503":
      $ref: ../components/responses/service_unavailable.yaml
